[project]
name = "incident-investigator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adiii19", email = "2022.aditya.mhatre@ves.ac.in" }
]
requires-python = ">=3.11"
dependencies = [
    "groq>=1.7.0",
    "mcp[cli]>=2.0.0",
    "psycopg[binary]>=3.2.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.0",
]

[project.scripts]
data-incident-investigator = "data_incident_investigator:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--import-mode=importlib"
